name: AdvancedStrategy fixed-parameter diagnostics

on:
  push:
    branches:
      - "research/diagnostics-*"

permissions:
  contents: read

jobs:
  fixed-parameter-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out diagnostic research commit
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pinned development dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Test diagnostic aggregation
        env:
          PYTHONPATH: backend:.
        run: python -m unittest tests.test_advanced_strategy_diagnostics -v

      - name: Run fixed-parameter train-validation-OOS diagnostics
        env:
          PYTHONPATH: backend
        run: |
          python scripts/run_advanced_strategy_diagnostics.py \
            --output artifacts/advanced_strategy_fixed_parameter_diagnostics.json

      - name: Publish diagnostic report
        uses: actions/upload-artifact@v4
        with:
          name: advanced-strategy-fixed-parameter-diagnostics-${{ github.run_number }}
          path: artifacts/advanced_strategy_fixed_parameter_diagnostics.json
          if-no-files-found: error
          retention-days: 90
