name: Multi-symbol acceptance implementation CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - "research/preregister-multi-symbol-v2"

permissions:
  contents: read

jobs:
  backend-and-research-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pinned development dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Validate dependencies
        run: python -m pip check

      - name: Compile backend, scripts and tests
        run: python -m compileall -q backend scripts tests

      - name: Run pytest
        env:
          PYTHONPATH: backend
        run: python -m pytest -q

      - name: Run unittest
        env:
          PYTHONPATH: backend
        run: python -m unittest discover -s tests -v
