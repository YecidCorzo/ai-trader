name: AdvancedStrategy multi-symbol real-history acceptance

on:
  push:
    branches:
      - "research/acceptance-run-*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-history-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out research commit
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pinned development dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run pre-registered nine-symbol public-history acceptance
        env:
          PYTHONPATH: backend
        run: |
          python scripts/run_multi_symbol_advanced_strategy_acceptance.py \
            --output artifacts/advanced_strategy_acceptance_multi_symbol_v2.json

      - name: Publish complete acceptance report (including NO_GO)
        uses: actions/upload-artifact@v4
        with:
          name: advanced-strategy-acceptance-multi-symbol-v2-${{ github.run_number }}
          path: artifacts/advanced_strategy_acceptance_multi_symbol_v2.json
          if-no-files-found: error
          retention-days: 90
