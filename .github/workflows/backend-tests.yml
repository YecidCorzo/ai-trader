name: Backend tests

on:
  push:
    branches:
      - main
      - "feature/**"
      - "fix/**"
      - "integration/**"
      - "platform/**"
      - "finance/**"
      - "trading/**"
      - "security/**"
      - "ci/**"
  pull_request:
    # Do not filter target branches: stacked PRs also require the same checks.
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned runtime dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Verify dependency consistency
        run: python -m pip check
      - name: Compile backend and tests
        run: python -m compileall -q backend tests
      - name: Run complete pytest suite
        run: pytest -q
      - name: Run complete unittest suite
        env:
          PYTHONPATH: backend
        run: python -m unittest discover -s tests -v

  real-history-acceptance:
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'research/acceptance-run-final-')
    needs: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out acceptance sample
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pinned dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run pre-registered public-history acceptance
        env:
          PYTHONPATH: backend
        run: |
          python scripts/run_advanced_strategy_acceptance.py \
            --output artifacts/advanced_strategy_acceptance.json

      - name: Publish complete acceptance report
        uses: actions/upload-artifact@v4
        with:
          name: advanced-strategy-acceptance-SOLUSDT-1h-${{ github.run_number }}
          path: artifacts/advanced_strategy_acceptance.json
          if-no-files-found: error
          retention-days: 90
