name: Backend tests

on:
  push:
    branches:
      - "feature/**"
      - "fix/**"
      - "integration/**"
      - "platform/**"
      - "finance/**"
      - "trading/**"
      - "security/**"
      - "ci/**"
  pull_request:
    # Do not filter target branches: stacked PRs also require the same checks.
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify dependency consistency
        run: python -m pip check
      - name: Compile backend and tests
        run: python -m compileall -q backend tests
      - name: Run complete pytest suite
        run: pytest -q
      - name: Run complete unittest suite
        env:
          PYTHONPATH: backend
        run: python -m unittest discover -s tests -v
