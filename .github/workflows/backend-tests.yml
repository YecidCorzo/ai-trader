name: Backend tests

on:
  push:
    branches: [feature/financial-platform]
  pull_request:
    branches: [feature/financial-platform]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run standard-library unit tests
        run: python -m unittest discover -s tests -v
