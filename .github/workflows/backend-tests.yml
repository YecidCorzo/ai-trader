name: Backend tests

on:
  push:
    branches:
      - "feature/**"
      - "fix/**"
  pull_request:
    branches:
      - main
      - "feature/**"
      - "fix/**"

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install market service test dependency
        run: python -m pip install fastapi requests
      - name: Run unit tests
        env:
          PYTHONPATH: backend
        run: python -m unittest discover -s tests -v
